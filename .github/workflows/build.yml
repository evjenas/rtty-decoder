name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test decoder
        run: node web/test.js

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RttyDecoder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RttyDecoder
          path: RttyDecoder.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RTTY декодер v1.0.${{ github.run_number }}
          files: RttyDecoder.apk
